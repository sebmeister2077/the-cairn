<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="dns-prefetch" href="https://map.tops.vintagestory.at" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cairn" />
    <!-- <meta property="og:image" content="/preview.png" /> -->
    <meta name="twitter:card" content="summary" />
    <!-- <meta name="twitter:image" content="/preview.png" /> -->
    <!-- Route-specific tags (title, description, canonical, robots, og/twitter title and
         description) come from src/lib/seo/pages.ts: the build replaces everything between
         the seo markers for each route (plugins/seo.ts) and the app updates them on
         navigation (components/seo/RouteSeo.tsx). Don't hardcode a canonical URL here. -->
    <!-- seo:start -->
    <title>Cairn – Vintage Story Interactive Map, Translocator Planner & Waypoint Tools</title>
    <meta
      name="description"
      content="Free community toolkit for Vintage Story: explore the TOPS server map with translocators, traders and landmarks, plan routes, track auction house prices and manage your waypoints."
    />
    <!-- seo:end -->
    <!-- NOTE: this inline script is allowlisted in the CSP (vercel.json) by its
         SHA-256 hash. If you edit it, recompute the hash or it will be blocked. -->
    <script>
      // Pre-paint theme script: applies the saved theme before React renders
      // to avoid a flash of the wrong color scheme. Mirrors lib/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem("theme_preference");
          var pref = "auto";
          if (raw) {
            var parts = raw.split(":");
            if (
              parts[0] === "1" &&
              (parts[1] === "auto" || parts[1] === "light" || parts[1] === "dark")
            ) {
              pref = parts[1];
            }
          }
          var resolved = pref;
          if (pref === "auto") {
            resolved =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          var root = document.documentElement;
          root.classList.toggle("dark", resolved === "dark");
          root.classList.toggle("light", resolved === "light");
          root.style.colorScheme = resolved;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
