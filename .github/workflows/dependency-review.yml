name: Dependency Review

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan PR dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail the PR if a dependency has a vulnerability at or above this level.
          fail-on-severity: high
          # Post a summary of findings as a comment on the PR.
          comment-summary-in-pr: always
