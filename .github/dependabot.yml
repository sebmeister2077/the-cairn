version: 2
updates:
  # Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      # One consolidated PR for all backend Python updates.
      backend-python:
        patterns:
          - "*"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # One consolidated PR for all frontend npm updates.
      frontend-npm:
        patterns:
          - "*"

  # NuGet (.NET tools)
  # - package-ecosystem: "nuget"
  #   directory: "/tools/creature-icon-exporter"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 10
  #   labels:
  #     - "dependencies"
  #     - "dotnet"

  # Keep GitHub Actions themselves up to date (and patched)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One consolidated PR for all GitHub Actions updates.
      github-actions:
        patterns:
          - "*"
